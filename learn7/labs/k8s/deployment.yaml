# AI-ML · Part 7 lab — inference Deployment for a GPU model workload (Ch 6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker-llm
  labels:
    app.kubernetes.io/name: ranker-llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ranker-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranker-llm
    spec:
      terminationGracePeriodSeconds: 120        # above p99 generation time
      priorityClassName: inference-critical      # preempt batch on shared GPU pools
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ranker-llm
      containers:
        - name: server
          image: vllm/vllm-openai:v0.6.3
          args:
            - "--model=/mnt/models"
            - "--served-model-name=ranker-llm"
            - "--max-num-seqs=32"
            - "--enable-prefix-caching"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              nvidia.com/gpu: 1
              memory: 20Gi
            limits:
              nvidia.com/gpu: 1
              memory: 24Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]   # drain before SIGTERM
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
