# Scale on a load signal, not CPU (Ch 6 / Part 6 Ch 9). Keep a warm floor.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ranker-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ranker-llm
  minReplicas: 2
  maxReplicas: 14
  metrics:
    - type: Pods
      pods:
        metric:
          name: vllm_num_requests_waiting     # queue depth — a leading signal
        target:
          type: AverageValue
          averageValue: "5"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
