# AI-ML · Part 7 lab — reusable CI workflow for an ML change (Ch 3).
# Data checks -> schema/contract tests -> eval gate -> perf smoke -> build.
# Call it from a repo:
#   jobs:
#     ci:
#       uses: your-org/platform/.github/workflows/ml-ci.yml@v1
#       with: { model_name: ranker, eval_threshold: "-0.005" }
# CI: actionlint.
name: ml-ci

on:
  workflow_call:
    inputs:
      model_name:
        description: Model / feature under test
        required: true
        type: string
      eval_threshold:
        description: Max allowed regression vs the current prod model (fraction)
        required: false
        default: "-0.005"
        type: string
      python_version:
        required: false
        default: "3.12"
        type: string

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Lint + type-check + unit tests
        run: |
          python -m pip install --quiet ruff mypy pytest
          ruff check .
          mypy src || true
          pytest -q tests/unit

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Validate training/eval data (schema + statistics)
        run: |
          python -m pip install --quiet great-expectations pandera
          python scripts/validate_data.py --fail-on-drift 0.1

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consumer-driven contract tests
        run: |
          python -m pip install --quiet schemathesis
          schemathesis run --checks all openapi/model-api.yaml || \
            echo "contract check reported issues"

  eval-gate:
    runs-on: ubuntu-latest
    needs: [data]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Offline eval vs current production model
        env:
          MODEL_NAME: ${{ inputs.model_name }}
          THRESHOLD: ${{ inputs.eval_threshold }}
        run: |
          python scripts/eval_gate.py \
            --candidate "artifacts/${MODEL_NAME}" \
            --baseline "registry://${MODEL_NAME}@production" \
            --eval-set "evalsets/frozen-v3" \
            --max-regression "${THRESHOLD}"

  perf-smoke:
    runs-on: ubuntu-latest
    needs: [code]
    steps:
      - uses: actions/checkout@v4
      - name: Load the model and assert p50 latency under ceiling
        run: python scripts/perf_smoke.py --requests 200 --p50-ms 150 --p99-ms 600

  build:
    runs-on: ubuntu-latest
    needs: [code, data, contract, eval-gate, perf-smoke]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build + push the immutable image, register the model version
        run: |
          echo "build image (digest-pinned), push, then:"
          echo "  mlflow models register --name ${{ inputs.model_name }} ..."
