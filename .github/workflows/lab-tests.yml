name: AI Lab Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run layer + scenario tester (69 checks)
        run: python lab/scenarios_tester.py

      - name: Run micrograd lessons (regression check)
        run: |
          python micrograd/step1_just_values.py
          python micrograd/step2_one_neuron.py
          python micrograd/step3_full_network.py

      - name: Run tokenizer lessons (regression check)
        run: |
          python tokenizer/step1_why_tokenize.py
          python tokenizer/step2_train_bpe.py
          python tokenizer/step3_encode_decode.py

      - name: Run attention lessons (regression check)
        run: |
          python attention/step1_similarity.py
          python attention/step2_self_attention.py
          python attention/step3_mini_transformer.py

      - name: Run matmul lessons (regression check)
        run: |
          python matmul/step1_naive.py
          python matmul/step2_tiled.py
          python matmul/step3_strassen.py
          python matmul/step4_matvec.py

      - name: Run embeddings lessons (regression check)
        run: |
          python embeddings/step1_meaning_as_geometry.py
          python embeddings/step2_learn_word_vectors.py
          python embeddings/step3_vector_search.py

      - name: Run rag lessons (regression check)
        run: |
          python rag/step1_prompting.py
          python rag/step2_mini_rag.py
          python rag/step3_agent_loop.py

      - name: Run finetuning lessons (regression check)
        run: |
          python finetuning/step1_lora.py
          python finetuning/step2_reward_model.py
          python finetuning/step3_preference_optimization.py

      - name: Run serving lessons (regression check)
        run: |
          python serving/step1_quantization.py
          python serving/step2_kv_cache.py
          python serving/step3_serving_throughput.py

  # Parts 6-9 are static courses (shared renderer + lazy per-chapter data) plus
  # runnable infra configs under learnN/labs/. This job syntax-checks the course
  # JS/JSON and validates every lab config with the standard tool for its kind.
  parts_6_9:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Syntax-check the shared renderer and every course data file
        run: |
          node --check assets/course.js
          for f in $(find learn6 learn7 learn8 learn9 -path '*/assets/*' -name '*.js'); do
            echo "check $f"; node --check "$f"
          done

      - name: Each part has a manifest and at least chapter 1
        run: |
          for p in learn6 learn7 learn8 learn9; do
            test -f "$p/assets/manifest.js" || { echo "missing $p/assets/manifest.js"; exit 1; }
            test -f "$p/assets/ch/01.js"   || { echo "missing $p/assets/ch/01.js"; exit 1; }
          done

      - name: Install lab-config validators (yamllint, shellcheck, kustomize, kubeconform, actionlint)
        run: |
          python -m pip install --quiet yamllint pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v1.7.1/actionlint_1.7.1_linux_amd64.tar.gz" | tar xz actionlint
          sudo mv kustomize kubeconform actionlint /usr/local/bin/
          # kubeconform can't validate a Helm .tpl file; kept out of the yaml/kubeconform globs
          echo "LAB_HELM_TEMPLATES=learn6/labs/serving/templates" >> "$GITHUB_ENV"

      - name: yamllint every lab YAML (excluding Helm templates)
        run: |
          shopt -s globstar nullglob
          files=()
          for f in learn6/labs/**/*.y*ml learn7/labs/**/*.y*ml learn8/labs/**/*.y*ml learn9/labs/**/*.y*ml; do
            [[ "$f" == "$LAB_HELM_TEMPLATES"* ]] && continue
            files+=("$f")
          done
          if [ ${#files[@]} -gt 0 ]; then
            yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" "${files[@]}"
          else
            echo "no YAML labs yet"
          fi

      - name: Validate JSON lab configs
        run: |
          shopt -s globstar nullglob
          for f in learn6/labs/**/*.json learn7/labs/**/*.json learn8/labs/**/*.json learn9/labs/**/*.json; do
            echo "json $f"; python -m json.tool "$f" > /dev/null
          done

      - name: Shell scripts — parse + shellcheck
        run: |
          shopt -s globstar nullglob
          for f in learn6/labs/**/*.sh learn7/labs/**/*.sh learn8/labs/**/*.sh learn9/labs/**/*.sh; do
            echo "check $f"; bash -n "$f"; shellcheck "$f"
          done

      - name: Compile-check every lab Python file
        run: |
          shopt -s globstar nullglob
          for f in learn6/labs/**/*.py learn7/labs/**/*.py learn8/labs/**/*.py learn9/labs/**/*.py; do
            echo "compile $f"; python -m py_compile "$f"
          done

      - name: Run the standalone lab scripts (each must exit 0)
        run: |
          python learn6/labs/capacity/sizing.py
          python learn7/labs/image/assert_env.py --dry-run
          python learn8/labs/llm/instrument_demo.py
          python learn8/labs/drift/monitor.py
          python learn9/labs/tenancy/simulate.py
          python learn9/labs/airmf/score.py
          python learn9/labs/finops/model.py
          python learn9/labs/readiness/check.py

      - name: actionlint — the reusable ml-ci.yml workflow
        run: actionlint -shellcheck= learn7/labs/ci/ml-ci.yml

      - name: kubeconform — plain Kubernetes manifests (CRDs ignored)
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            learn7/labs/k8s/ learn7/labs/rollout/ \
            learn7/labs/gitops/base/ learn7/labs/gitops/application.yaml

      - name: kustomize build — both overlays render and validate
        run: |
          for env in staging prod; do
            echo "kustomize build overlays/$env"
            kustomize build "learn7/labs/gitops/overlays/$env" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: helm lint + render the KServe chart, then kubeconform it
        run: |
          helm lint learn6/labs/serving
          helm template lab learn6/labs/serving \
            | kubeconform -ignore-missing-schemas -summary

      - name: terraform validate — the IaC lab (no credentials required)
        working-directory: learn7/labs/iac
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform fmt -check -recursive

      - name: docker compose config — every compose lab
        run: |
          for f in learn6/labs/gateway/docker-compose.yml \
                   learn6/labs/cache/docker-compose.yml \
                   learn8/labs/stack/docker-compose.yml; do
            echo "compose config $f"
            docker compose -f "$f" config -q
          done

      - name: promtool check rules — the Prometheus SLO/burn-rate rules
        run: |
          docker run --rm -v "$PWD":/w --entrypoint promtool \
            prom/prometheus:v2.53.2 check rules /w/learn8/labs/rules/prometheus-rules.yml

      - name: otelcol validate — the Collector config (tail sampling, GenAI attrs)
        run: |
          docker run --rm -v "$PWD":/w otel/opentelemetry-collector-contrib:0.109.0 \
            validate --config=/w/learn8/labs/otel/collector.yaml

      - name: k6 inspect — the load-test script parses
        run: |
          docker run --rm -i grafana/k6:0.53.0 inspect - < learn6/labs/loadtest/script.js > /dev/null