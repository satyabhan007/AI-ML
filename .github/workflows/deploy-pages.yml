name: Deploy AI-ML to GitHub Pages

# Deploys the static site plus the raw lesson sources so in-page links to
# `<module>/stepN_*.py` resolve (GitHub Pages serves them as plain text).
# Package: index.html, 404.html, assets/, learn/, lab/, and every module
# dir (micrograd, tokenizer, attention, matmul, embeddings, rag, finetuning,
# serving) — their .html/.css/.js/.svg/.md AND .py. Excludes: *.ps1,
# auto_sync.log, __pycache__, .github/, watch scripts.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: "GitHub Actions") so the first deploy
          # works without manually flipping Settings → Pages.
          enablement: true

      - name: Build site package (static site + raw lesson sources)
        run: |
          rm -rf _site_pkg && mkdir -p _site_pkg
          cp index.html _site_pkg/ 2>/dev/null || true
          cp 404.html _site_pkg/ 2>/dev/null || true
          cp *.md _site_pkg/ 2>/dev/null || true
          cp LICENSE _site_pkg/ 2>/dev/null || true
          for d in assets learn learn2 learn3 learn4 lab micrograd tokenizer attention matmul \
                   embeddings rag finetuning serving; do
            [ -d "$d" ] && mkdir -p "_site_pkg/$d" && \
              find "$d" \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.png' -o -name '*.json' -o -name '*.md' -o -name '*.py' \) \
                -not -path '*/node_modules/*' -not -path '*/__pycache__/*' -exec cp --parents {} _site_pkg/ \;
          done
          # strip Windows helpers / logs that sit next to the sources
          find _site_pkg \( -name '*.ps1' -o -name 'auto_sync.log' -o -name '__pycache__' \) -exec rm -rf {} + 2>/dev/null || true
          du -sh _site_pkg && find _site_pkg -type f | head -60

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_pkg

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4