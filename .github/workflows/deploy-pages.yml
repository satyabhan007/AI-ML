name: Deploy AI-ML to GitHub Pages

# Deploys ONLY the static web files (no .py sources, tests, or watcher scripts).
# Package list: index.html, 404.html, assets/, lab/*.html, lab/assets.(css|js),
# micrograd explainer .md mirrored at root, learn/. Excludes: *.py, *.ps1,
# auto_sync.log, .github/, watch scripts.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: "GitHub Actions") so the first deploy
          # works without manually flipping Settings → Pages.
          enablement: true

      - name: Build lean site package (web files only)
        run: |
          rm -rf _site_pkg && mkdir -p _site_pkg
          cp index.html _site_pkg/ 2>/dev/null || true
          cp 404.html _site_pkg/ 2>/dev/null || true
          for d in assets learn lab tokenizer attention micrograd; do
            [ -d "$d" ] && mkdir -p "_site_pkg/$d" && \
              find "$d" \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.png' -o -name '*.json' -o -name '*.md' \) \
                -not -path '*/node_modules/*' -exec cp --parents {} _site_pkg/ \;
          done
          # strip python/tests/logs that slipped in via .md-adjacent copies
          find _site_pkg \( -name '*.py' -o -name '*.ps1' -o -name 'auto_sync.log' -o -name '__pycache__' \) -delete
          # exclude raw python sources & tests explicitly
          find _site_pkg \( -name '*test*.py' -o -name 'scenarios_tester.py' \) -delete || true
          du -sh _site_pkg && find _site_pkg -type f | head -40

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_pkg

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4