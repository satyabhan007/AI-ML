# AI-ML · Part 8 lab — OTel Collector: OTLP in, tail sampling, GenAI attrs, fan-out.
# Validate:  otelcol validate --config=collector.yaml
#   (docker run --rm -v "$PWD":/w otel/opentelemetry-collector-contrib:0.109.0 \
#        validate --config=/w/learn8/labs/otel/collector.yaml)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # redact anything sensitive before it leaves the cluster (Ch 2 anti-patterns)
  attributes/redact:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: http.request.header.authorization
        action: delete

  # keep the useful traces, sample the boring successes (Ch 2 / Ch 14)
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1500
      - name: sample-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  resourcedetection:
    detectors: [env, system]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true      # exemplars: metric -> trace (Ch 10)
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, attributes/redact, tail_sampling, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
